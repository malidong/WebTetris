<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris Game</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a1a2e;
      font-family: Arial, sans-serif;
      color: white;
    }
    #game-container {
      display: flex;
      gap: 20px;
    }
    canvas {
      border: 2px solid #16213e;
      background-color: #0f3460;
    }
    #info-panel {
      min-width: 200px;
    }
    h2 { margin-top: 0; }
    ul { padding-left: 20px; }
    li { margin: 5px 0; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="tetris-canvas" width="500" height="600"></canvas>
    <div id="info-panel">
      <h2>Tetris</h2>
      <p>Score: <span id="score">0</span></p>
      <p>Level: <span id="level">1</span></p>
      <p>Lines: <span id="lines">0</span></p>
      <p>High Score: <span id="high-score">0</span></p>
      <h3>Controls</h3>
      <ul>
        <li>← → : Move</li>
        <li>↓ : Soft drop</li>
        <li>Space : Hard drop</li>
        <li>↑ : Rotate CW</li>
        <li>Z : Rotate CCW</li>
        <li>P : Pause</li>
        <li>R : Restart</li>
      </ul>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
